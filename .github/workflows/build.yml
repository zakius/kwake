name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Static checks (clazy, qmllint, shellcheck)
    runs-on: ubuntu-latest
    # Lints need type information as current as the KDE stack the form targets.
    # Arch tracks it closely and, unlike Debian sid, stays installable mid-transition.
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake extra-cmake-modules clazy qt6-base qt6-declarative kcoreaddons kconfig kcmutils kirigami kdeclarative nodejs python shellcheck

      - name: Run checks
        run: ./check.sh

  plugin:
    name: Plugin (Debian 13, ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      # Native ARM runners are not reliably available to private repositories,
      # and a job waiting for one never fails, it just hangs; emulate instead.
      - name: Set up ARM emulation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build
        run: docker run --rm --platform linux/${{ matrix.arch }} -v "$PWD":/src -w /src debian:trixie bash ci/build-plugin.sh

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.arch }}
          path: dist/*.so
          if-no-files-found: error

  load-test:
    name: Loads on ${{ matrix.image }} (${{ matrix.arch }})
    needs: plugin
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: ["debian:trixie", "ubuntu:26.04", "fedora:44"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up ARM emulation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: actions/download-artifact@v4
        with:
          name: plugin-${{ matrix.arch }}
          path: dist

      - name: Load the plugin
        run: docker run --rm --platform linux/${{ matrix.arch }} -v "$PWD":/src -w /src ${{ matrix.image }} bash ci/load-test.sh

  latest-frameworks:
    name: Builds against current KDE Frameworks (Arch)
    runs-on: ubuntu-latest
    # Early warning for a framework change that breaks the build.
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          pacman -Syu --noconfirm --needed base-devel cmake extra-cmake-modules qt6-base qt6-declarative kcoreaddons kconfig kcmutils
          cmake -S kcm -B kcm/build -DCMAKE_BUILD_TYPE=Release
          cmake --build kcm/build --parallel

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, load-test, latest-frameworks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -- *.so > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            -- *.so SHA256SUMS
