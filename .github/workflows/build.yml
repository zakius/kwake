name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Static checks (clazy, qmllint, shellcheck)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake extra-cmake-modules clazy \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-declarative-dev-tools \
            libkf6coreaddons-dev libkf6config-dev libkf6kcmutils-dev \
            qml6-module-org-kde-kirigami qml6-module-org-kde-kcmutils \
            qml6-module-org-kde-kquickcontrols qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            nodejs python3 shellcheck

      - name: Run checks
        run: ./check.sh

  settings-page:
    name: Settings page (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian trixie is what PikaOS and friends are built on, so this job
          # produces a plugin that is usable on those systems.
          - name: debian trixie
            image: debian:trixie
            artifact: true
          # Arch tracks KDE Frameworks closely, so this job is the early warning
          # for a framework change that breaks the build.
          - name: arch
            image: archlinux:latest
            artifact: false
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies (debian)
        if: startsWith(matrix.image, 'debian')
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake extra-cmake-modules \
            qt6-base-dev qt6-declarative-dev \
            libkf6coreaddons-dev libkf6config-dev libkf6kcmutils-dev

      - name: Install build dependencies (arch)
        if: startsWith(matrix.image, 'archlinux')
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake extra-cmake-modules qt6-base qt6-declarative \
            kcoreaddons kconfig kcmutils

      - name: Build
        run: |
          cmake -S kcm -B kcm/build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release
          cmake --build kcm/build --parallel

      - name: Upload plugin
        if: matrix.artifact
        uses: actions/upload-artifact@v4
        with:
          name: kcm_toggle_windows-debian-trixie
          path: kcm/build/bin/kwin/effects/configs/kcm_toggle_windows.so
          if-no-files-found: error
