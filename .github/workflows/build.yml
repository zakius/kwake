name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (qmllint, shellcheck)
    runs-on: ubuntu-latest
    # qmllint needs type information as current as the KDE stack the form
    # targets. Arch tracks it closely and, unlike Debian sid, stays installable
    # mid-transition. The C++ is checked by clazy in the plugin job.
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: pacman -Syu --noconfirm --needed qt6-declarative kcmutils kirigami kdeclarative nodejs shellcheck

      - name: Run checks
        run: ./check.sh

  plugin:
    name: Build with clazy (Debian 13, ${{ matrix.arch }})
    # Each architecture builds natively on its own runner.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker run --rm -v "$PWD":/src -w /src debian:trixie bash ci/build-plugin.sh

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.arch }}
          path: dist/*.so
          if-no-files-found: error

  load-test:
    name: Loads on ${{ matrix.image }} (${{ matrix.arch }})
    needs: plugin
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: ["debian:trixie", "ubuntu:26.04", "fedora:44"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: plugin-${{ matrix.arch }}
          path: dist

      - name: Load the plugin
        run: docker run --rm -v "$PWD":/src -w /src ${{ matrix.image }} bash ci/load-test.sh

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, load-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: dist
          merge-multiple: true

      - name: Build the self-contained installer
        run: |
          sudo apt-get update
          sudo apt-get install -y makeself
          ci/make-bundle.sh "$GITHUB_REF_NAME"

      - name: Checksums
        run: cd dist && sha256sum -- *.run > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.run
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
