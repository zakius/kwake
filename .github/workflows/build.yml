name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (qmllint, shellcheck)
    runs-on: ubuntu-latest
    # qmllint needs type information as current as the KDE stack the form
    # targets. Arch tracks it closely and, unlike Debian sid, stays installable
    # mid-transition. The C++ is checked by clazy in the plugin job.
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: pacman -Syu --noconfirm --needed qt6-declarative kcmutils kirigami kdeclarative nodejs shellcheck

      - name: Run checks
        run: ./check.sh

  lifecycle:
    name: KWin lifecycle (Debian 13)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v5

      - name: Install runtime tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends kwin-wayland kdialog python3 \
            dbus-daemon qdbus-qt6 libkf6config-bin libgl1-mesa-dri libcap2-bin qt6-wayland
          # The container cannot grant KWin's file-based CAP_SYS_NICE capability.
          setcap -r /usr/bin/kwin_wayland

      - name: Test script enable, disable and unload
        run: python3 tests/test_lifecycle.py

  plugin:
    name: Build with clazy (Debian 13, ${{ matrix.arch }})
    # Each architecture builds natively on its own runner.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker run --rm -v "$PWD":/src -w /src debian:trixie bash ci/build-plugin.sh

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  package:
    name: Build .deb and .rpm packages
    needs: plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: dist
          merge-multiple: true

      - name: Package
        run: |
          curl -fsSLo /tmp/nfpm.deb https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_amd64.deb
          sudo dpkg -i /tmp/nfpm.deb
          ci/make-packages.sh

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  load-test:
    name: Installs on ${{ matrix.image }} (${{ matrix.arch }})
    needs: package
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: ["debian:trixie", "ubuntu:26.04", "fedora:44"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Install the package and load the plugin
        run: docker run --rm -v "$PWD":/src -w /src ${{ matrix.image }} bash ci/load-test.sh

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, lifecycle, load-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Build the self-contained installer
        run: |
          sudo apt-get update
          sudo apt-get install -y makeself
          ci/make-bundle.sh "$GITHUB_REF_NAME"

      - name: Checksums
        run: cd dist && sha256sum -- *.run *.deb *.rpm > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.run
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
